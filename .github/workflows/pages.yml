name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Follow the repository's default branch, regardless of its name.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check application and helper
        run: |
          node --check app.js
          node --check word-timing.js
          node --check media-finder.js
          node --check visualizer.js
          node --check direct-audio.js
          node --check fullscreen-controls.js
          node --test tests/*.test.cjs
          # Real Firefox audio is a local-helper integration test. The hosted
          # runner blocks its namespace sandbox, and Pages ships static files.
          python3 -m unittest discover -s tests -p 'test_server.py'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html style.css app.js word-timing.js media-finder.js visualizer.js direct-audio.js fullscreen-controls.js _site/
          cp -r vendor _site/
          # Give every deployment fresh asset URLs, including in returning browsers.
          for asset in style.css app.js word-timing.js media-finder.js visualizer.js direct-audio.js fullscreen-controls.js; do
            sed -i "s|\"${asset}\"|\"${asset}?v=${GITHUB_SHA}\"|g" _site/index.html
          done
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
